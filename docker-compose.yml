services:
  llm-benchmark:
    image: "${LLM_BENCHMARK_IMAGE:-llm-benchmark:latest}"
    pull_policy: never
    container_name: "${LLM_BENCHMARK_CONTAINER_NAME:-llm-benchmark}"
    restart: unless-stopped
    init: true
    ports:
      - "${LLM_BENCHMARK_BIND_ADDRESS:-0.0.0.0}:${LLM_BENCHMARK_WEB_PORT:-8080}:8080"
    environment:
      LLM_BENCHMARK_USER: "${LLM_BENCHMARK_USER:?请在 .env 中设置登录用户名}"
      LLM_BENCHMARK_PASSWORD: "${LLM_BENCHMARK_PASSWORD:?请在 .env 中设置登录密码}"
      LLM_BENCHMARK_SESSION_SECRET: "${LLM_BENCHMARK_SESSION_SECRET:?请在 .env 中设置至少 16 位的会话密钥}"
      LLM_BENCHMARK_SESSION_HOURS: "${LLM_BENCHMARK_SESSION_HOURS:-12}"
      LLM_BENCHMARK_SECURE_COOKIE: "${LLM_BENCHMARK_SECURE_COOKIE:-false}"
      LLM_BENCHMARK_HOST: 0.0.0.0
      LLM_BENCHMARK_PORT: "8080"
      LLM_BENCHMARK_DATA_DIR: /app/data
      LLM_BENCHMARK_FRONTEND_DIR: /app/frontend/dist
    volumes:
      - app-data:/app/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health/ready', timeout=3).read()"
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 6
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=64m,mode=1777
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  app-data:
    name: "${LLM_BENCHMARK_DATA_VOLUME:-llm-benchmark-data}"
