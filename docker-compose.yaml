version: '3.8'

services:
  llm-benchmark:
    build:
      context: .
      dockerfile: Dockerfile
    image: llm-benchmark:latest
    container_name: llm-benchmark
    ports:
      - "8080:8080"
    volumes:
      - ./reports:/app/reports
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
      - TZ=Asia/Shanghai
      - BENCH_USER=admin
      - BENCH_PASS=admin
      - JWT_SECRET_KEY=change-me-in-production
    restart: unless-stopped
